<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anmeldung – Mini E-Commerce</title>
  </head>
  <body>
    <main>
      <h1>Mini E-Commerce</h1>
      <div id="clerk-auth"></div>
    </main>

    <script
      defer
      crossorigin="anonymous"
      src="https://liked-calf-9123.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
      type="text/javascript"
    ></script>

    <script
      defer
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_bGlrZWQtY2FsZi05MTIzLmNsZXJrLmFjY291bnRzLmRldiQ"
      src="https://liked-calf-9123.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    <script>
      window.addEventListener("load", async () => {
        await Clerk.load({
          ui: { ClerkUI: window.__internal_ClerkUICtor },
        });

        const authContainer = document.getElementById("clerk-auth");
        Clerk.mountSignIn(authContainer, {
          forceRedirectUrl: "/index.html",
        });
      });
    </script>
  </body>
</html>
